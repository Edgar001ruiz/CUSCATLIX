    <!-- Usamos clases de Bootstrap para centrar y dar diseño -->
    <div class="container my-5 animar-entrada">
        <h2 class="text-center mb-4">Contacto Cuscatlix</h2>
        
        <div class="row justify-content-center">
            <div class="col-md-6">
                <form class="p-4 border-rojo">
                    <fieldset>
                        <legend class="text-uppercase">Datos de contacto</legend>
                        
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre:</label>
                            <input type="text" class="form-control custom-input" id="nombre" placeholder="Ingrese su nombre" required>
                        </div>

                        <div class="mb-3">
                            <label for="correo" class="form-label">Correo:</label>
                            <input type="email" class="form-control custom-input" id="correo" placeholder="correo@email.com" required>
                        </div>

                        <div class="mb-3">
                            <label for="telefono" class="form-label">Teléfono:</label>
                            <input type="tel" class="form-control custom-input" id="telefono" required>
                        </div>

                        <div class="mb-3">
                            <label for="tema" class="form-label">Selecciona punto de consulta:</label>
                            <select id="tema" class="form-select custom-input" required>
                                <option class="opt-oscuro">Leyendas Cuscatlecas</option>
                                <option class="opt-oscuro">Enviar historia</option>
                                <option class="opt-oscuro">Dudas</option>
                                <option class="opt-oscuro">Otro</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="mensaje" class="form-label">Deja tu comentario</label>
                            <textarea id="mensaje" class="form-control custom-input" rows="4" style="resize: none;"></textarea>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-netflix w-100">Enviar</button>
                            <button type="reset" class="btn btn-secondary w-100">Borrar</button>
                        </div>
                    </fieldset>
                </form>
            </div>
        </div>
    </div>
